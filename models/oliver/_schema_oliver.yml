version: 2

models:
  - name: oliver_dim_customer
    description: "Customer dimension table, containing descriptive attributes about Oliver's customers."
    columns:
      - name: customer_key
        description: "Primary key for the customer dimension (from CUSTOMER_ID)."
        tests:
          - unique
          - not_null

  - name: oliver_dim_date
    description: "Date dimension table, generated from unique ORDER_DATEs."
    columns:
      - name: date_key
        description: "Primary key for the date dimension."
        tests:
          - unique
          - not_null
      - name: date_day
        description: "The calendar date (YYYY-MM-DD)."

  - name: oliver_dim_employee
    description: "Employee dimension table."
    columns:
      - name: employee_key
        description: "Primary key for the employee dimension (from EMPLOYEE_ID)."
        tests:
          - unique
          - not_null

  - name: oliver_dim_product
    description: "Product dimension table."
    columns:
      - name: product_key
        description: "Primary key for the product dimension (from PRODUCT_ID)."
        tests:
          - unique
          - not_null

  - name: oliver_dim_store
    description: "Store dimension table."
    columns:
      - name: store_key
        description: "Primary key for the store dimension (from STORE_ID)."
        tests:
          - unique
          - not_null

  - name: fact_sales
    description: "Fact table containing sales transactions at the order line item level."
    columns:
      - name: sales_key
        description: "Unique surrogate key for each sales line item."
        tests:
          - unique
          - not_null
      - name: date_key
        description: "Foreign key to the Date dimension."
        tests:
          - not_null
          - relationships:
              to: ref('oliver_dim_date')
              field: date_key
      - name: customer_key
        description: "Foreign key to the Customer dimension."
        tests:
          - relationships:
              to: ref('oliver_dim_customer')
              field: customer_key
      - name: sales_amount
        description: "The calculated total price of the line item (QUANTITY * UNIT_PRICE)."
        tests:
          - not_null

  - name: sales
    description: "Semantic layer model: Denormalized view of sales for easy consumption by analysts."
    
  - name: stg_employee_certifications
    description: |
      Staging model for employee certification data.
      Parses the 'certification_json' field to extract certification name, cost, and awarded date.
      
  - name: fact_certification
    description: |
      Employee Certification Fact.
      The grain of this table is **one record per certification awarded to an employee**.
      Contains keys to dim_employee and dim_date, along with certification cost and name.